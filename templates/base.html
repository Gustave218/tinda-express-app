<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Tinda Express</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <!-- REMIX ICON -->
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
        rel="stylesheet"
    >

    <!-- PWA -->
    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <meta
        name="theme-color"
        content="#ff7b00"
    >

    <!-- IOS PWA -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Tinda Express"
    >

    <link
        rel="apple-touch-icon"
        href="{{ url_for('static', filename='images/logo.png') }}"
    >

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/logo.png') }}"
    >

</head>

<body>

{% block content %}{% endblock %}

<!-- INSTALL POPUP -->
<div
    class="install-popup"
    id="installPopup"
    style="display:none;"
>

    <div class="install-content">

        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            class="install-logo"
        >

        <h3>
            Installer Tinda Express
        </h3>

        <p>
            Accédez rapidement à vos livraisons.
        </p>

        <button
            id="installBtn"
        >
            Installer
        </button>

    </div>

</div>

<!-- APP JS -->
<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>

<!-- SERVICE WORKER -->
<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        async () => {

            try {

                await navigator
                .serviceWorker
                .register(
                    "/static/sw.js"
                );

                console.log(
                    "Service Worker registered"
                );

            } catch (error) {

                console.log(error);

            }

        }
    );

}

</script>

<!-- INSTALL PWA -->
<script>

let deferredPrompt;

window.addEventListener(
    "beforeinstallprompt",
    (e) => {

        e.preventDefault();

        deferredPrompt = e;

        document
        .getElementById("installPopup")
        .style.display = "flex";

    }
);

document
.getElementById("installBtn")
.addEventListener(
    "click",
    async () => {

        if(!deferredPrompt){

            return;

        }

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt = null;

        document
        .getElementById("installPopup")
        .style.display = "none";

    }
);

</script>

</body>
</html>
