<!DOCTYPE html>
<html lang="fr">
<head>
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>
<title>Tinda Express</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

<meta name="theme-color" content="#ff7b00">

</head>

<body>

{% block content %}{% endblock %}

<script src="{{ url_for('static', filename='js/app.js') }}"></script>


<script>

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {

    e.preventDefault();

    deferredPrompt = e;

    const installBox = document.createElement("div");

    installBox.className = "install-popup";

    installBox.innerHTML = `
    
        <div class="install-content">

            <h3>
                Installer Tinda Express
            </h3>

            <p>
                Accédez plus rapidement à vos colis.
            </p>

            <button id="installBtn">
                Installer
            </button>

        </div>

    `;

    document.body.appendChild(installBox);

    document
    .getElementById("installBtn")
    .addEventListener("click", async () => {

        installBox.remove();

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt = null;

    });

});

</script>

<script>

async function initPushNotifications(){

    if(!("serviceWorker" in navigator)){

        return;
    }

    try{

        // REGISTER SERVICE WORKER
        const registration =
        await navigator.serviceWorker.register(
            "/static/js/service-worker.js"
        );

        // ASK PERMISSION
        const permission =
        await Notification.requestPermission();

        if(permission !== "granted"){

            return;
        }

        // CREATE SUBSCRIPTION
        const subscription =
        await registration.pushManager.subscribe({

            userVisibleOnly: true,

            applicationServerKey: urlBase64ToUint8Array(
                "{{ config['VAPID_PUBLIC_KEY'] }}"
            )

        });

        // SAVE TO DATABASE
        await fetch("/save-subscription", {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify(subscription)

        });

        console.log(
            "Push notifications activated"
        );

    }catch(error){

        console.log(error);

    }

}

// CONVERT VAPID KEY
function urlBase64ToUint8Array(base64String){

    const padding =
        '='.repeat(
            (4 - base64String.length % 4) % 4
        );

    const base64 =
        (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');

    const rawData =
        window.atob(base64);

    const outputArray =
        new Uint8Array(rawData.length);

    for(let i = 0; i < rawData.length; ++i){

        outputArray[i] =
            rawData.charCodeAt(i);

    }

    return outputArray;
}

initPushNotifications();

</script>
</body>
</html>
