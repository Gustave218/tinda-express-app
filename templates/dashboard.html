{% extends "base.html" %}
{% block content %}

<div class="dashboard-page">

    <!-- TOPBAR -->
    <div class="dashboard-top">

        <div class="brand-box">

            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                class="top-logo"
            >

            <div>
                <h2>Tinda Express</h2>
                <p>Livraison intelligente</p>
            </div>

        </div>

        <a href="/logout" class="logout-btn">
            <i class="ri-logout-box-r-line"></i>
        </a>

    </div>

    <!-- TITLE -->
    <div class="title-area">

        <h1>
            Que voulez-vous envoyer ?
        </h1>

        <p>
            Livraison rapide et sécurisée partout en RDC
        </p>

    </div>

    <!-- FORM -->
    <form
        action="/create_parcel"
        method="POST"
        enctype="multipart/form-data"
        id="parcelForm"
    >

        <!-- CATEGORY GRID -->
        <div class="category-grid">

            <!-- FOOD -->
            <label class="modern-category">

                <input
                    type="radio"
                    name="category"
                    value="À manger"
                    required
                >

                <div class="category-content">

                    <div class="category-icon food-bg">
                        <i class="ri-restaurant-2-fill"></i>
                    </div>

                    <h3>À manger</h3>

                    <p>Repas & boissons</p>

                </div>

            </label>

            <!-- DOCUMENT -->
            <label class="modern-category">

                <input
                    type="radio"
                    name="category"
                    value="Documents"
                    required
                >

                <div class="category-content">

                    <div class="category-icon doc-bg">
                        <i class="ri-file-paper-2-fill"></i>
                    </div>

                    <h3>Documents</h3>

                    <p>Papiers importants</p>

                </div>

            </label>

            <!-- FRAGILE -->
            <label class="modern-category">

                <input
                    type="radio"
                    name="category"
                    value="Colis fragile"
                    required
                >

                <div class="category-content">

                    <div class="category-icon fragile-bg">
                        <i class="ri-box-3-fill"></i>
                    </div>

                    <h3>Fragile</h3>

                    <p>Objets sensibles</p>

                </div>

            </label>

            <!-- OTHER -->
            <label class="modern-category">

                <input
                    type="radio"
                    name="category"
                    value="Autres"
                    required
                >

                <div class="category-content">

                    <div class="category-icon other-bg">
                        <i class="ri-shopping-bag-3-fill"></i>
                    </div>

                    <h3>Autres</h3>

                    <p>Autres colis</p>

                </div>

            </label>

        </div>

        <!-- LOCATION CARD -->
        <div class="location-card">

            <h2>
                Informations de livraison
            </h2>

            <!-- PICKUP -->
            <div class="location-block">

                <div class="location-left">
                    <div class="circle-start"></div>
                    <div class="vertical-line"></div>
                </div>

                <div class="location-right">

                    <div class="modern-input">
                        <i class="ri-map-pin-2-fill"></i>

                        <input
                            type="text"
                            name="pickup_ville"
                            placeholder="Ville de ramassage"
                            required
                        >
                    </div>

                    <div class="modern-input">
                        <i class="ri-community-fill"></i>

                        <input
                            type="text"
                            name="pickup_commune"
                            placeholder="Commune"
                            required
                        >
                    </div>

                    <div class="modern-input">
                        <i class="ri-road-map-fill"></i>

                        <input
                            type="text"
                            name="pickup_avenue"
                            placeholder="Avenue"
                            required
                        >
                    </div>

                    <div class="modern-input">
                        <i class="ri-home-4-fill"></i>

                        <input
                            type="text"
                            name="pickup_numero"
                            placeholder="Numéro"
                            required
                        >
                    </div>

                    <div class="modern-input">
                        <i class="ri-map-2-line"></i>

                        <input
                            type="text"
                            name="pickup_reference"
                            placeholder="Référence"
                            required
                        >
                    </div>

                </div>

            </div>

            <!-- DELIVERY -->
            <div class="location-block">

                <div class="location-left">

                    <div class="circle-end">
                        <i class="ri-map-pin-fill"></i>
                    </div>

                </div>

                <div class="location-right">

                    <div class="modern-input">
                        <i class="ri-map-pin-fill"></i>

                        <input
                            type="text"
                            name="delivery_ville"
                            placeholder="Ville de livraison"
                            required
                        >
                    </div>

                    <div class="modern-input">
                        <i class="ri-community-fill"></i>

                        <input
                            type="text"
                            name="delivery_commune"
                            placeholder="Commune"
                            required
                        >
                    </div>

                    <div class="modern-input">
                        <i class="ri-road-map-fill"></i>

                        <input
                            type="text"
                            name="delivery_avenue"
                            placeholder="Avenue"
                            required
                        >
                    </div>

                    <div class="modern-input">
                        <i class="ri-home-4-fill"></i>

                        <input
                            type="text"
                            name="delivery_numero"
                            placeholder="Numéro"
                            required
                        >
                    </div>

                    <div class="modern-input">
                        <i class="ri-map-2-line"></i>

                        <input
                            type="text"
                            name="delivery_reference"
                            placeholder="Référence"
                            required
                        >
                    </div>

                </div>

            </div>

        </div>

        <!-- PARCEL INFO -->
        <div class="receiver-card">

            <h2>Détails du colis</h2>

            <!-- Parcel name -->
            <div class="modern-input">
                <i class="ri-box-3-line"></i>

                <input
                    type="text"
                    name="parcel_name"
                    placeholder="Nom du colis"
                    required
                >
            </div>

            <!-- Parcel description -->
            <div class="modern-input">
                <i class="ri-file-text-line"></i>

                <input
                    type="text"
                    name="parcel_description"
                    placeholder="Description du colis"
                >
            </div>

            <!-- IMAGE -->
            <label class="parcel-upload" id="uploadBox">

                <input
                    type="file"
                    id="parcelImage"
                    name="parcel_image"
                    accept="image/*"
                    onchange="previewParcelImage(event)"
                    required
                >

                <div class="upload-inner">

                    <div class="upload-icon">
                        <i class="ri-image-add-fill"></i>
                    </div>

                    <h3>Photo du colis</h3>

                    <p>
                        Prendre une photo ou choisir depuis la galerie
                    </p>

                </div>

            </label>

            <!-- PREVIEW -->
            <div
                class="parcel-preview"
                id="parcelPreview"
                style="display:none;"
            >

                <img id="parcelPreviewImg">

            </div>

        </div>

        <!-- RECEIVER -->
        <div class="receiver-card">

            <h2>
                Destinataire
            </h2>

            <div class="modern-input">
                <i class="ri-user-3-fill"></i>

                <input
                    type="text"
                    name="receiver_name"
                    placeholder="Nom du destinataire"
                    required
                >
            </div>

            <div class="modern-input">
                <i class="ri-phone-fill"></i>

                <input
                    type="tel"
                    name="receiver_phone"
                    placeholder="Téléphone"
                    required
                >
            </div>

            <div class="modern-input">
                <i class="ri-mail-fill"></i>

                <input
                    type="email"
                    name="receiver_email"
                    placeholder="Adresse email"
                >
            </div>

        </div>

        <!-- BUTTON -->
        <button
            type="submit"
            class="modern-send-btn"
            id="sendBtn"
        >

            <i class="ri-send-plane-fill"></i>

            Envoyer maintenant

        </button>

    </form>

</div>

<!-- NAVBAR -->
<div class="bottom-nav">

    <a href="/dashboard" class="nav-item active">
        <i class="ri-home-5-fill"></i>
        <span>Accueil</span>
    </a>

    <a href="/mes-envois" class="nav-item">
        <i class="ri-box-3-fill"></i>
        <span>Mes envois</span>
    </a>

    <a href="/profil" class="nav-item">
        <i class="ri-user-3-fill"></i>
        <span>Profil</span>
    </a>

</div>

<!-- SCRIPT -->
<script>

function previewParcelImage(event) {

    const file = event.target.files[0];

    if (!file) return;

    const preview =
        document.getElementById("parcelPreview");

    const img =
        document.getElementById("parcelPreviewImg");

    img.src = URL.createObjectURL(file);

    preview.style.display = "block";
}

const form =
    document.getElementById("parcelForm");

const button =
    document.getElementById("sendBtn");

form.addEventListener("submit", function(e) {

    // CATEGORY CHECK
    const categorySelected =
        document.querySelector(
            'input[name="category"]:checked'
        );

    if (!categorySelected) {

        e.preventDefault();

        document.querySelector(".category-grid")
        .scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

        alert(
            "Veuillez sélectionner une catégorie"
        );

        return;
    }

    // REQUIRED INPUTS
    const requiredFields =
        form.querySelectorAll(
            "input[required]"
        );

    for (let field of requiredFields) {

        // FILE IMAGE
        if (
            field.type === "file" &&
            field.files.length === 0
        ) {

            e.preventDefault();

            document
            .getElementById("uploadBox")
            .scrollIntoView({

                behavior: "smooth",

                block: "center"

            });

            alert(
                "Veuillez ajouter une photo du colis"
            );

            return;
        }

        // EMPTY FIELD
        if (
            field.type !== "file" &&
            !field.value.trim()
        ) {

            e.preventDefault();

            field.focus();

            field.scrollIntoView({

                behavior: "smooth",

                block: "center"

            });

            alert(
                "Veuillez remplir tous les champs"
            );

            return;
        }
    }

    // LOADING BUTTON
    button.disabled = true;

    button.innerHTML = `
        <i class="ri-loader-4-line spinner"></i>
        Veuillez patienter...
    `;
});

</script>

{% endblock %}
