{% extends "base.html" %}
{% block content %}

<div class="auth-page">

    <!-- BACKGROUND -->
    <div class="auth-bg"></div>

    <!-- CARD -->
    <div class="auth-card">

        <!-- LOGO -->
        <div class="auth-logo-box">

            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                class="auth-logo"
            >

        </div>

        <!-- TITLE -->
        <h1 class="auth-title">

            Bon retour 👋

        </h1>

        <p class="auth-subtitle">

            Connectez-vous pour suivre vos colis en temps réel.

        </p>

        <!-- ERROR -->
        {% if error %}

        <div class="auth-error">

            <i class="ri-error-warning-fill"></i>

            <span>

                {{ error }}

            </span>

        </div>

        {% endif %}

        <!-- FORM -->
        <form
            class="auth-form"
            method="POST"
            id="loginForm"
        >

            <!-- PHONE -->
            <div class="input-box">

                <i class="ri-phone-line"></i>

                <input
                    type="tel"
                    name="phone"
                    value="{{ request.form.get('phone', '') }}"
                    placeholder="Téléphone"
                    autocomplete="tel"
                    required
                >

            </div>

            <!-- PASSWORD -->
            <div class="input-box password-box">

                <i class="ri-lock-2-line"></i>

                <input
                    type="password"
                    name="password"
                    placeholder="Mot de passe"
                    id="loginPassword"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="toggleLoginPassword()"
                >

                    <i
                        class="ri-eye-line"
                        id="loginEye"
                    ></i>

                </button>

            </div>

            <!-- BUTTON -->
            <button
                type="submit"
                class="btn-auth"
                id="loginBtn"
            >

                <i class="ri-login-box-line"></i>

                Se connecter

            </button>

        </form>

        <!-- BOTTOM -->
        <div class="auth-bottom">

            <span>

                Vous n’avez pas de compte ?

            </span>

            <a href="/register">

                Créer un compte

            </a>

        </div>

    </div>

</div>

<!-- SCRIPT -->
<script>

function toggleLoginPassword(){

    const password =
        document.getElementById("loginPassword");

    const eye =
        document.getElementById("loginEye");

    if(password.type === "password"){

        password.type = "text";

        eye.className = "ri-eye-off-line";

    }else{

        password.type = "password";

        eye.className = "ri-eye-line";

    }
}

document
.getElementById("loginForm")
.addEventListener("submit", function(e){

    const form = this;

    if(!form.checkValidity()){

        return;
    }

    const btn =
        document.getElementById("loginBtn");

    btn.disabled = true;

    btn.innerHTML = `
        <i class="ri-loader-4-line spin"></i>
        Connexion...
    `;
});

</script>

{% endblock %}
