{% extends "base.html" %}
{% block content %}

<div class="admin-page">

    <div class="page-header">

        <h1>Dashboard Admin</h1>

        <p>
            Gestion des colis Tinda Express
        </p>

    </div>

    <div class="admin-grid">

        {% for parcel in parcels %}

        <div class="admin-card">

            {% if parcel.parcel_image %}
            <img
                src="{{ parcel.parcel_image }}"
                class="admin-image"
            >
            {% endif %}

            <div class="admin-content">

                <h3>
                    {{ parcel.parcel_name }}
                </h3>

                <p>
                    {{ parcel.category }}
                </p>

                <div class="admin-status">

                    {{ parcel.status }}

                </div>

                <a
                    href="/admin/parcel/{{ parcel.id }}"
                    class="admin-btn"
                >
                    Gérer
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
